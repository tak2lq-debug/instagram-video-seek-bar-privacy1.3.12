<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Seek Bar Settings</title><style>body{width:280px;padding:16px;margin:0;background:#18181b;color:#fafafa;font:14px system-ui}h2{font-size:17px;margin:0 0 15px}label{display:block;margin:12px 0 5px}input[type=range]{width:100%}input[type=color]{width:100%;height:32px}select{width:100%;padding:7px;background:#27272a;color:white;border:1px solid #52525b;border-radius:5px}.hint{font-size:11px;color:#aaa;margin-top:14px}output{float:right;color:#ddd}</style></head><body><h2>シークバー設定</h2><label>通常の太さ <output id="thin-value"></output></label><input id="thin" type="range" min="2" max="10" step="1"><label>ホバー時の太さ <output id="thick-value"></output></label><input id="thick" type="range" min="4" max="16" step="1"><label>色</label><input id="color" type="color"><label>透明度 <output id="opacity-value"></output></label><input id="opacity" type="range" min="30" max="100" step="5"><label>つまみ</label><select id="thumb"><option value="circle">丸型</option><option value="none">なし</option></select><p class="hint">設定は自動保存され、開いているInstagramにも反映されます。</p><script src="popup.js"></script></body></html>
